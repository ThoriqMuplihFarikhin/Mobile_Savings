kizin(id){const k=SR('kolektor',id),on=k.izin==='Diizinkan';dlg({t:on?'Nonaktifkan':'Aktifkan',m:on?'Nonaktifkan izin penarikan offline langsung kolektor ini?':'Aktifkan izin penarikan offline langsung kolektor ini?',ok:on?'Nonaktifkan':'Aktifkan',fn:()=>{k.izin=on?'Diblokir':'Diizinkan';toast('Izin diperbarui');render()}})},kunlock(){toast('Kunci akun kolektor dibuka')},kpin(id){A.pin(id,'kolektor')},
koreksi(id){const r=SR('msetoran',id);dlg({t:'Koreksi Setoran',m:'Ubah nominal setoran yang sudah tercatat.',f:[{k:'n',l:'Nominal baru',t:'number',v:r.nominal,r:1},{k:'a',l:'Alasan koreksi',t:'textarea',r:1,min:5}],ok:'Koreksi',fn:v=>{r.nominal=+v.n;r.status='Dikoreksi';toast('Setoran dikoreksi');render()}})},
batal(id){const r=SR('msetoran',id);dlg({t:'Batalkan Setoran',m:'Setoran yang dibatalkan akan dikurangi dari saldo nasabah.',f:[{k:'a',l:'Alasan pembatalan',t:'textarea',r:1,min:5}],ok:'Batalkan setoran',tone:'d',fn:()=>{r.status='Dibatalkan';toast('Setoran dibatalkan');render()}})},
kproses(id){SR('komplain',id).status='Diproses';toast('Komplain diproses');render()},
kdetail(id){const r=SR('komplain',id);drw('Detail Komplain',sec('Komplain',kv([['Nasabah',r.nasabah],['Kategori',r.kategori],['Tanggal',r.tgl],['Status',chip(r.status)]])+'<p style="margin-top:8px">'+r.deskripsi+'</p>')+sec('Transaksi terkait',kv([['Tanggal transaksi','12 Okt'],['Produk','Qurban 2027'],['Nominal',rp(300000)]]))+(r.status!=='Selesai'?sec('Penyelesaian',fld('ks','Catatan penyelesaian','textarea','Jelaskan tindakan yang dilakukan...')+'<div class="er2" id="kse"></div><div class="df"><button class="btn b1" data-a="ksel" data-id="'+id+'">Selesaikan</button></div>'):''))},
ksel(id){if($('#ks').value.trim().length<5){$('#kse').textContent='Catatan penyelesaian wajib diisi.';return}SR('komplain',id).status='Selesai';closeDrw();toast('Komplain diselesaikan');render()},
'rk-proses'(id){const r=SR('rekon',id);dlg({t:'Proses setoran '+r.kolektor,m:'Total seharusnya '+rp(r.seharusnya),f:[{k:'d',l:'Total diterima (fisik)',t:'number',v:r.seharusnya,r:1},{k:'k',l:'Keterangan selisih (wajib bila ada selisih)',t:'textarea',ph:'Jelaskan penyebab selisih...'}],ok:'Proses',fn:v=>{const d=+v.d;if(d!==r.seharusnya&&v.k.length<3)return 'Keterangan selisih wajib diisi.';D.rekonH.unshift(['Hari ini',r.kolektor,r.seharusnya,d,d===r.seharusnya?'Cocok':d>r.seharusnya?'Lebih':'Kurang']);D.rekon.splice(D.rekon.indexOf(r),1);const k=D.kas.find(x=>x.kolektor===r.kolektor);if(k){k.kas=0;k.pending=0}toast('Setoran diproses');render()}})},
'rk-tolak'(id){const r=SR('rekon',id);dlg({t:'Tolak pengajuan?',f:[{k:'a',l:'Alasan penolakan (wajib)',t:'textarea',r:1,ph:'Jelaskan alasan penolakan...'}],ok:'Tolak',tone:'d',fn:()=>{D.rekonH.unshift(['Hari ini',r.kolektor,r.seharusnya,0,'Ditolak']);D.rekon.splice(D.rekon.indexOf(r),1);toast('Pengajuan ditolak');render()}})},
'rk-man'(){dlg({t:'Input Manual Setoran Kas',f:[{k:'k',l:'Kolektor',t:'select',o:D.kolektor.map(x=>x.nama)},{k:'d',l:'Total diterima (Rp)',t:'number',r:1},{k:'a',l:'Keterangan',t:'textarea',ph:'Opsional'}],ok:'Simpan',fn:v=>{D.rekonH.unshift(['Hari ini',v.k,0,+v.d,'Lebih']);toast('Setoran kas dicatat');render()}})},
csv(){toast('Berkas CSV diunduh (contoh)')},kreset(){ST.komisi={q:'',f:{}};render()},
hand(){const a=D.kolektor[HS.a],b=D.kolektor[HS.b];if($('[data-a=hand]').getAttribute('aria-disabled')==='true')return;dlg({t:'Proses handover?',m:a.nama+' akan dinonaktifkan dan nasabahnya dipindahkan ke '+b.nama+'.',ok:'Proses handover',fn:()=>{a.status='Nonaktif';D.hand.unshift(['Hari ini',a.nama,b.nama,a.nasabah,'Admin Sari','Lunas']);toast('Handover selesai');render()}})},
sganti(){SPN={n:null};render()},spilih(id){SPN.n=SR('nasabah',id);render()},snom(id){$('#s-n').value=id},
setor(){const v=+$('#s-n').value;if(!(v>0)){$('#se').textContent='Isi nominal setoran dulu.';return}D.stoday.unshift([new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}).replace(':','.'),SPN.n.nama,$('#s-p').value,v]);SPN={n:null};toast('Setoran dicatat');render()},
'izin-ok'(id){const z=SR('izin',id);D.izin.splice(D.izin.indexOf(z),1);toast('Izin disetujui');render()},
'izin-no'(id){const z=SR('izin',id);dlg({t:'Tolak izin?',f:[{k:'a',l:'Catatan admin (opsional)',t:'textarea'}],ok:'Tolak',tone:'d',fn:()=>{D.izin.splice(D.izin.indexOf(z),1);toast('Izin ditolak');render()}})},
'bukti-abs'(id){const r=SR('absen',id);drw('Detail Absensi',sec('Kolektor',kv([['Nama',r.nama],['Waktu masuk',r.waktu],['Koordinat','-6,9147, 107,6098']]))+'<div class="row2"><div class="card cp" style="text-align:center;color:var(--mu);height:120px;display:grid;place-items:center">Foto selfie</div><div class="card cp" style="text-align:center;color:var(--mu);height:120px;display:grid;place-items:center">Tanda tangan</div></div>')},
'serah-do'(id){const r=SR('serah',id);dlg({t:'Serah terima paket',m:r.nasabah+' · '+r.produk,f:[{k:'b',l:'Diterima oleh',r:1},{k:'t',l:'Tanggal serah terima',t:'date',v:'2026-10-20',r:1},{k:'f',l:'Foto bukti terlampir (JPG/PNG/WebP, maks. 5 MB)',t:'check'}],ok:'Konfirmasi serah terima',fn:v=>{if(!v.f)return 'Lampirkan foto bukti dulu.';r.tab='sudah';r.ket=v.b+', '+dt(v.t);toast('Paket diserahkan');render()}})},
psave(){toast('Konfigurasi disimpan')},wtest(){toast('Pesan uji coba dikirim (contoh)')},backup(){toast('Backup database dibuat (contoh)')},profil(){dlg({t:'Edit Profil Saya',f:[{k:'n',l:'Nama',v:'Admin Sari',r:1}],ok:'Simpan',fn:()=>toast('Profil disimpan')})},gpin(){dlg({t:'Ganti PIN Saya',f:[{k:'a',l:'PIN lama',t:'password',r:1},{k:'b',l:'PIN baru (6 angka)',t:'password',r:1}],ok:'Simpan PIN',fn:v=>/^\d{6}$/.test(v.b)?(toast('PIN diganti'),0):'PIN baru harus 6 angka.'})},theme(){document.documentElement.classList.toggle('dark')},logout(){parent!==window?parent.postMessage({logout:1},'*'):toast('Anda keluar (contoh)')}};

function view(){switch(cur){case 'dashboard':return dash();case 'persetujuan':return hub();case 'registrasi':return regis();case 'rekon':return rekonP();case 'komisi':return komisiP();case 'handover':return handP();case 'setoran':return setP();case 'absensi':return absP();case 'serah':return serahP();case 'laporan':return lapP();case 'pengaturan':return pengP();default:return list(cur)}}
function render(){const y=scrollY;$('#view').innerHTML=view();nav();document.title=(TTL[cur]||'Admin')+' | Tabungan Digital';$('#view').dataset.p=cur}
function go(p){cur=p;closeDrw();$('#sb').classList.remove('open');$('#scr').classList.remove('on');render();$('#view').focus({preventScroll:true});scrollTo(0,0)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-mn],[data-a],[data-fk],[data-x],[data-dx],[data-sv],[data-lt],[data-pt],[data-gs],#hbg,#scr,#thm');const mn=$('#mn');
if(e.target.id==='ov'){closeDlg();return}
if(!t){mn.hidden=true;return}
if(!t.matches('[data-mn]')&&!t.matches('[data-gs]'))mn.hidden=true;
if(t.matches('[data-go]'))return go(t.dataset.go);
if(t.matches('[data-gs]')){const[p,q]=t.dataset.gs.split('|');(ST[p]||(ST[p]={q:'',f:{}})).q=q;$('#gs').value='';return go(p)}
if(t.matches('[data-mn]')){const pid=t.dataset.p,r=SR(pid,t.dataset.id),a=PG[pid].acts(r),items=a.filter(x=>x[3]==='m').concat(a.filter(x=>x[3]!=='m').slice(2));return menu(t,items)}
if(t.matches('[data-a]')){const k=t.dataset.a;if(A[k])A[k](t.dataset.id,t.dataset.p||cur);return}
if(t.matches('[data-fk]')){const p=t.dataset.fp||cur;(ST[p]||(ST[p]={q:'',f:{}})).f[t.dataset.fk]=t.dataset.fv;return render()}
if(t.matches('[data-x]'))return closeDlg();if(t.matches('[data-dx]')||t.id==='scr'){closeDrw();return}
if(t.matches('[data-sv]')){SV=t.dataset.sv;return render()}if(t.matches('[data-lt]')){LT=t.dataset.lt;return render()}if(t.matches('[data-pt]')){PT=t.dataset.pt;return render()}
if(t.id==='hbg'){$('#sb').classList.add('open');$('#scr').classList.add('on');return}
if(t.id==='thm')return A.theme()});
document.addEventListener('input',e=>{const t=e.target;
if(t.matches('[data-sq]')){const p=t.dataset.sq;ST[p].q=t.value;const pos=t.selectionStart;render();const n=$('[data-sq="'+p+'"]');n.focus();n.setSelectionRange(pos,pos)}
else if(t.matches('[data-sq2]')){SPN.q=t.value;const pos=t.selectionStart;render();const n=$('[data-sq2]');n&&(n.focus(),n.setSelectionRange(pos,pos))}
else if(t.id==='gs'){const q=t.value.toLowerCase().trim(),m=$('#mn');if(!q){m.hidden=true;return}const rs=D.nasabah.filter(n=>n.nama.toLowerCase().includes(q)).slice(0,4).map(n=>[n.nama+' (nasabah)','nasabah|'+n.nama]).concat(D.kolektor.filter(k=>k.nama.toLowerCase().includes(q)).slice(0,3).map(k=>[k.nama+' (kolektor)','kolektor|'+k.nama]));m.innerHTML=rs.length?rs.map(x=>'<button data-gs="'+x[1]+'">'+x[0]+'</button>').join(''):'<button disabled>Tidak ada hasil</button>';m.hidden=false;const r=t.getBoundingClientRect();m.style.top=r.bottom+4+'px';m.style.left=r.left+'px'}
else if(t.closest('#pf')){if(t.classList.contains('pfb')){PF.b[+t.dataset.i][+t.dataset.f]=t.value}pfCalc()}});
document.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-hs]')){HS[t.dataset.hs]=+t.value;render()}else if(t.id==='pf-t'){const p=t.selectedIndex===0;$('#pf-s').closest('.fl').style.opacity=p?1:.4;pfCalc()}else if(t.id==='bk'){const v=t.value;$('#bkx').innerHTML=v.startsWith('Tunda')?fld('bx','Tunda hingga','date'):v==='Gagal - Dialihkan'?fld('bx','Produk tujuan','select','','',['Tabungan Bebas','Paket Lebaran 2027']):v==='Lanjut'?fld('bx','Metode pengambilan','select','','',['Ambil sendiri','Diantar kolektor']):''}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDlg();closeDrw();$('#mn').hidden=true}});
$('#hbg').innerHTML=I('menu');$('#thm').innerHTML=I('moon');$('#gsi').innerHTML=I('search');
window.addEventListener('message',e=>{if(e.data&&e.data.fresh)go('dashboard')});
render();

</script></body></html>
