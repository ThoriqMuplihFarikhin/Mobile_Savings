name: build-apk

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Flavor yang dibangun"
        required: false
        default: all
        type: choice
        options:
          - all
          - nasabah
          - kolektor
          - admin
  push:
    tags:
      - "apk-*"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      flavors: ${{ steps.pilih.outputs.flavors }}
      version: ${{ steps.pilih.outputs.version }}
    steps:
      - name: Menentukan flavor dan versi
        id: pilih
        env:
          FLAVOR_INPUT: ${{ inputs.flavor || 'all' }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$FLAVOR_INPUT" in
            all|nasabah|kolektor|admin) ;;
            *) echo "Flavor tidak valid: $FLAVOR_INPUT" >&2; exit 1 ;;
          esac

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$FLAVOR_INPUT" != "all" ]; then
            echo "flavors=[\"$FLAVOR_INPUT\"]" >> "$GITHUB_OUTPUT"
          else
            echo 'flavors=["nasabah","kolektor","admin"]' >> "$GITHUB_OUTPUT"
          fi
          VERSI="$(echo "$REF_NAME" | sed -n 's/^apk-//p')"
          echo "version=${VERSI:-dev}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJson(needs.plan.outputs.flavors) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Siapkan Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Bangun APK flavor ${{ matrix.flavor }}
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ needs.plan.outputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash mobile/scripts/build-flavor.sh "${{ matrix.flavor }}"

      - name: Unggah APK
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea28fcfb5122d466fa83499fa # v4.4.0
        with:
          name: tabungan-${{ matrix.flavor }}-${{ needs.plan.outputs.version }}
          path: mobile/build/${{ matrix.flavor }}/*.apk
          if-no-files-found: error
